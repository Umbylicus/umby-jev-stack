<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jev X Highlight</title>
  <style>
    body { font: 13px/1.3 system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; color: #111; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    p { margin: 0 0 8px; color: #444; }
    button { font: inherit; }
    #turn { width: 100%; font-weight: 700; padding: 8px; margin-bottom: 8px; }
    .list { max-height: 360px; overflow: auto; border: 1px solid #ddd; border-radius: 8px; }
    .row { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center; padding: 4px 6px; border-bottom: 1px solid #eee; }
    .row button { padding: 3px 6px; }
    .row button.on-in { background: #e0b000; border-color: #e0b000; }
    .row button.on-out { background: #e02424; color: #fff; border-color: #e02424; }
    #status { min-height: 1.2em; margin: 8px 0 0; }
  </style>
</head>
<body>
  <h1>Jev X Highlight</h1>
  <p>Interested posts turn gold. Not interested, ads, and spam get a red X. Nothing else is marked.</p>
  <button id="turn" type="button">Turn on</button>
  <div id="list" class="list"></div>
  <p id="status"></p>
  <script src="categories.js"></script>
  <script src="popup.js"></script>
</body>
</html>
