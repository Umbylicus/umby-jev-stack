<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jev extension stack</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <img src="icons/umby-logo.png" alt="Umby">
  <h1>Jev extension stack</h1>
  <button id="turn" type="button" aria-pressed="false">Turn on</button>
  <div class="keys">
    <div class="site">
      <span id="focus-label">Focus mode</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-feature="focusDeclutter" aria-labelledby="focus-label"></button>
    </div>
    <div class="site">
      <span id="hide-label">Hide posts</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-feature="hidePosts" aria-labelledby="hide-label"></button>
    </div>
    <div class="site">
      <span id="ads-label">Ads</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-feature="ads" aria-labelledby="ads-label"></button>
    </div>
  </div>
  <div class="sites">
    <div class="site">
      <span id="site-x">X</span>
      <button class="switch" type="button" role="switch" aria-checked="true" data-site="x" aria-labelledby="site-x"></button>
    </div>
    <div class="site">
      <span id="site-facebook">Facebook</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-site="facebook" aria-labelledby="site-facebook"></button>
    </div>
    <div class="site">
      <span id="site-instagram">Instagram</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-site="instagram" aria-labelledby="site-instagram"></button>
    </div>
    <div class="site">
      <span id="site-youtube">YouTube</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-site="youtube" aria-labelledby="site-youtube"></button>
    </div>
    <div class="site">
      <span id="site-reddit">Reddit</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-site="reddit" aria-labelledby="site-reddit"></button>
    </div>
    <div class="site">
      <span id="site-linkedin">LinkedIn</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-site="linkedin" aria-labelledby="site-linkedin"></button>
    </div>
    <div class="site">
      <span id="site-gmail">Gmail</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-site="gmail" aria-labelledby="site-gmail"></button>
    </div>
    <div class="site">
      <span id="site-outlook">Outlook</span>
      <button class="switch" type="button" role="switch" aria-checked="false" data-site="outlook" aria-labelledby="site-outlook"></button>
    </div>
  </div>
  <button id="setup" type="button">Setup</button>
  <script src="lib/contract.js"></script>
  <script src="lib/runtime.js"></script>
  <script src="popup.js"></script>
</body>
</html>
